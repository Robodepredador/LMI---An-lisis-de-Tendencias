document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

style=\"display:flex;align-items:center;gap:10px;flex-shrink:0\"><img src=\"ecd32eb0-589a-48b6-940d-531538465ce4\" alt=\"Lumi\" style=\"width:42px;height:36px\"><strong style=\"font-family:'Bricolage Grotesque';font-size:20px;font-weight:800;white-space:nowrap\">LMI-U<\u002Fstrong><\u002Fdiv>\n        \n        <div style=\"display:flex;gap:22px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0\"><sc-for list=\"{{ navs }}\" as=\"n\" hint-placeholder-count=\"5\"><a sc-camel-on-click=\"{{ n.go }}\" style=\"font-size:15px;font-weight:500;color:#55527A;white-space:nowrap\">{{ n.label }}<\u002Fa><\u002Fsc-for><\u002Fdiv><div style=\"display:flex;gap:16px;align-items:center;font-size:15px;font-weight:500;flex-shrink:0\"><a sc-camel-on-click=\"{{ login }}\" style=\"color:#17153A;white-space:nowrap\">Iniciar sesión<\u002Fa><button sc-camel-on-click=\"{{ toRegistro }}\" style=\"font:600 15px 'Onest';padding:12px 20px;border-radius:999px;border:0;background:#17153A;color:#FFFFFF;white-space:nowrap\">Prueba gratis<\u002Fbutton><\u002Fdiv>\n      <\u002Fnav>\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:48px;padding:64px 48px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          \n          <h1 style=\"margin:0;font-family:'Bricolage Grotesque';font-size:64px;line-height:.98;font-weight:800;letter-spacing:-.04em;text-wrap:balance\">Descubre qué pide el mercado para tu carrera <span style=\"background:#C6F24E;padding:0 10px;border-radius:14px\">antes<\u002Fspan> de graduarte.<\u002Fh1>\n          <p style=\"margin:0;font-size:19px;line-height:1.55;color:#55527A;max-width:540px\">Analizamos miles de ofertas publicadas en Perú para decirte qué habilidades piden las empresas, cuánto pagan y qué roles crecen. Cada cifra enlaza a su fuente.<\u002Fp>\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ toRegistro }}\" style=\"font:600 17px 'Onest';padding:19px 30px;border-radius:999px;border:0;background:#4B3BFF;color:#FFFFFF;box-shadow:0 8px 24px rgba(75,59,255,.3)\">Prueba gratis · 3 consultas<\u002Fbutton><\u002Fdiv>\n          <span style=\"font-size:14px;color:#55527A\">Sin tarjeta. Si luego compras: Yape · Plin · Tarjeta · PagoEfectivo<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#F3F2FF;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><img src=\"d66c1ec6-90a3-4a60-9395-a6ab117a73de\" alt=\"Lumi\" style=\"width:52px;height:50px\"><span style=\"font-size:13px;font-weight:700;color:#4B3BFF\">Lumi encontró esto · Community Manager · Lima<\u002Fspan><\u002Fdiv>\n          <strong style=\"font-family:'Bricolage Grotesque';font-size:26px;font-weight:700;line-height:1.15\">Además de redes, 1 de cada 2 ofertas ya pide Meta Ads y Excel.<\u002Fstrong>\n          <div style=\"background:#FFFFFF;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:15px\"><span>Gestión de redes<\u002Fspan><div style=\"height:12px;background:#F3F2FF;border-radius:999px\"><div style=\"width:91%;height:12px;background:#C9C4FF;border-radius:999px\"><\u002Fdiv><\u002Fdiv><strong>91%<\u002Fstrong><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:15px\"><strong>Meta Ads<\u002Fstrong><div style=\"height:12px;background:#F3F2FF;border-radius:999px\"><div style=\"width:52%;height:12px;background:#4B3BFF;border-radius:999px\"><\u002Fdiv><\u002Fdiv><strong>52%<\u002Fstrong><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:15px\"><strong>Excel<\u002Fstrong><div style=\"height:12px;background:#F3F2FF;border-radius:999px\"><div style=\"width:48%;height:12px;background:#4B3BFF;border-radius:999px\"><\u002Fdiv><\u002Fdiv><strong>48%<\u002Fstrong><\u002Fdiv>\n            <span style=\"font-size:13px;color:#55527A\">640 ofertas · Computrabajo, Bumeran, LinkedIn · jul–oct 2026<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section id=\"sec-lumi\" style=\"margin:64px 48px 24px;padding:56px;background:#4B3BFF;color:#FFFFFF;border-radius:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:40px;align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <span style=\"align-self:flex-start;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:#C6F24E;color:#17153A\">Conoce a Lumi<\u002Fspan>\n          <h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1\">Tu analista del mercado laboral, en tu bolsillo.<\u002Fh2>\n          <p style=\"margin:0;font-size:18px;line-height:1.55;color:#E4E1FF;max-width:520px\">Lumi lee miles de ofertas cada semana y te cuenta lo que encontró en palabras simples. Siempre con la fuente a la mano.<\u002Fp>\n          <div style=\"display:flex;align-items:flex-end;gap:8px\"><img src=\"d66c1ec6-90a3-4a60-9395-a6ab117a73de\" alt=\"Lumi, la mascota de LMI-U\" style=\"width:260px;height:250px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:#FFFFFF;color:#17153A;border:3px solid #17153A;border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-family:'Bricolage Grotesque';font-size:21px;font-weight:800\">“Leo las ofertas por ti.”<\u002Fstrong><span style=\"font-size:15px;line-height:1.5;color:#55527A\">Computrabajo, Bumeran, LinkedIn y portales corporativos, sin duplicados.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#FFFFFF;color:#17153A;border:3px solid #17153A;border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-family:'Bricolage Grotesque';font-size:21px;font-weight:800\">“Te digo de dónde sale cada dato.”<\u002Fstrong><span style=\"font-size:15px;line-height:1.5;color:#55527A\">Muestra, periodo y enlace en cada cifra. Si hay menos de 30 ofertas, no invento nada.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#FFFFFF;color:#17153A;border:3px solid #17153A;border-radius:28px;padding:20px 24px;display:flex;flex-direction:column;gap:6px\"><strong style=\"font-family:'Bricolage Grotesque';font-size:21px;font-weight:800\">“Te sugiero qué aprender según tu ciclo.”<\u002Fstrong><span style=\"font-size:15px;line-height:1.5;color:#55527A\">En 2do ciclo te muestro tendencias; en 5to, qué priorizar antes de tus prácticas.<\u002Fspan><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toRegistro }}\" style=\"align-self:flex-start;font:600 17px 'Onest';padding:18px 28px;border-radius:999px;border:0;background:#C6F24E;color:#17153A;margin-top:6px\">Pregúntale a Lumi gratis<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section id=\"sec-funciones\" style=\"padding:48px 48px 56px;display:flex;flex-direction:column;gap:32px\"><div style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:14px;font-weight:700;letter-spacing:.08em;color:#4B3BFF\">FUNCIONES<\u002Fspan><h2 style=\"margin:0;font-family:'Bricolage Grotesque';font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.02\">Deja de adivinar qué estudiar este ciclo.<\u002Fh2><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px\"><div style=\"background:#4B3BFF;color:#FFFFFF;border-radius:28px;padding:36px;display:flex;flex-direction:column;gap:14px;min-height:280px\"><span style=\"font-size:15px;font-weight:600;color:#E4E1FF\">Habilidades<\u002Fspan><strong st }\" as=\"e\" hint-placeholder-count=\"3\"><button sc-camel-on-click=\"{{ e.run }}\" style=\"font:inherit;text-align:left;background:#FFFFFF;border:0;border-radius:20px;padding:20px 22px;color:#17153A;display:flex;flex-direction:column;gap:12px;min-height:150px\"><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#17153A;color:#FFFFFF\">{{ e.carrera }}<\u002Fspan><span style=\"font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F3F2FF;color:#4B3BFF\">{{ e.tipo }}<\u002Fspan><\u002Fdiv><span style=\"font-family:'Bricolage Grotesque';font-size:19px;font-weight:700;line-height:1.25;flex:1\">{{ e.q }}<\u002Fspan><span style=\"font-size:13px;font-weight:600;color:#4B3BFF\">Consultar · usa 1 crédito →<\u002Fspan><\u002Fbutton><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:sticky;bottom:0;margin:auto -40px -32px;padding:16px 40px 24px;background:linear-gradient(rgba(247,247,252,0),#F7F7FC 28%);display:flex;flex-direction:column;gap:8px\">\n              <div style=\"background:#FFFFFF;border-radius:999px;padding:8px 8px 8px 24px;display:flex;align-items:center;gap:12px;border:1.5px solid #E4E2F3;box-shadow:0 6px 24px rgba(23,21,58,.08)\">\n                <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" sc-camel-on-key-down=\"{{ onQKey }}\" placeholder=\"¿Cuánto gana un asistente contable en Lima?\" style=\"flex:1;font:400 16px 'Onest';border:0;outline:none;background:transparent;color:#17153A;min-width:0\">\n                <span style=\"font-size:12px;color:#55527A;white-space:nowrap\">{{ costLabel }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ sendFree }}\" style=\"width:46px;height:46px;border-radius:999px;border:0;background:#4B3BFF;color:#FFFFFF;font-weight:700;font-size:18px\">→<\u002Fbutton>\n              <\u002Fdiv>\n              <span style=\"font-size:13px;color:#55527A;padding-left:24px\">Escribe con tus palabras: el rol, la ciudad y si quieres saber habilidades, sueldo o tendencia.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin:auto;width:100%;max-width:560px;background:#FFFFFF;border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:20px\">\n              <div style=\"display:flex;align-items:center;gap:14px\"><img src=\"d93c51b8-e7d8-49fd-9e6b-b931e8e547ee\" alt=\"Lumi\" style=\"width:72px;height:80px\"><span style=\"font-size:15px;font-weight:700;color:#4B3BFF\">Lumi está revisando las ofertas…<\u002Fspan><\u002Fdiv>\n              <strong style=\"font-family:'Bricolage Grotesque';font-size:24px;font-weight:700;line-height:1.2\">{{ q }}<\u002Fstrong>\n              <div style=\"height:10px;background:#F3F2FF;border-radius:999px;overflow:hidden\"><div style=\"width:{{ loadPct }}%;height:10px;background:#4B3BFF;border-radius:999px;transition:width .45s\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;font-size:15px\"><sc-for list=\"{{ loadSteps }}\" as=\"l\" hint-placeholder-count=\"3\"><span style=\"color:{{ l.color }};font-weight:{{ l.weight }}\">{{ l.icon }} {{ l.t }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isResultado }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div style=\"display:flex;gap:8px\"><span style=\"font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:#FFFFFF\">{{ r.rol }}<\u002Fspan><span style=\"font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:#FFFFFF\">{{ r.city }}<\u002Fspan><\u002Fdiv>\n              <a sc-camel-on-click=\"{{ nueva }}\" style=\"font-size:14px\">+ Nueva consulta<\u002Fa>\n            <\u002Fdiv>\n<sc-for list=\"{{ turns }}\" as=\"t\" hint-placeholder-count=\"1\"><div style=\"display:flex;flex-direction:column;gap:18px;padding-bottom:20px\">\n            <div style=\"align-self:flex-end;background:#4B3BFF;color:#FFFFFF;border-radius:22px 22px 6px 22px;padding:14px 20px;font-size:16px;max-width:620px;line-height:1.45\">{{ t.q }}<\u002Fdiv>\n\n            <sc-if value=\"{{ t.insuf }}\">\n              <div style=\"background:#FFFFFF;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:14px;max-width:720px\">\n                <div style=\"display:flex;align-items:center;gap:14px\"><img src=\"8ae77b5b-8b8a-449c-9f90-1f134c055127\" alt=\"Lumi preocupado\" style=\"width:84px;height:92px\"><span style=\"font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:#FFE6DF;color:#B23A1E\">Muestra insuficiente<\u002Fspan><\u002Fdiv>\n                <strong style=\"font-family:'Bricolage Grotesque';font-size:28px;font-weight:700;line-height:1.15\">Solo encontramos {{ t.n }} ofertas de {{ t.rol }} en {{ t.city }}.<\u002Fstrong>\n                <p style=\"margin:0;font-size:16px;line-height:1.6;color:#55527A\">Con menos de 30 ofertas la cifra no es confiable, así que no la mostramos y <strong style=\"color:#17153A\">no descontamos tu consulta<\u002Fstrong>. Prueba ampliando la región.<\u002Fp>\n                <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button sc-camel-on-click=\"{{ t.ampliar }}\" style=\"font:600 15px 'Onest';padding:14px 22px;border-radius:999px;border:0;background:#4B3BFF;color:#FFFFFF\">Ver en Lima<\u002Fbutton><a sc-camel-on-click=\"{{ t.fuente }}\" style=\"padding:14px 6px\">¿Por qué 30 ofertas?<\u002Fa><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ t.ok }}\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px;align-items:start\">\n              <div style=\"display:flex;flex-direction:column;gap:16px\">\n                <div style=\"background:#FFFFFF;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n                  <span style=\"font-size:13px;font-weight:600;color:#4B3BFF\">Respuesta<\u002Fspan>\n                  <p style=\"margin:0;font-size:16px;line-height:1.65\">{{ t.texto }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:flex-end;gap:14px;padding-top:6px\">\n                  <img src=\"d93c51b8-e7d8-49fd-9e6b-b931e8e547ee\" alt=\"Lumi\" style=\"width:118px;height:130px;flex-shrink:0\">\n                  <div style=\"position:relative;flex:1;padding-bottom:54px\">\n                    <div style=\"background:#C6F24E;border:3px solid #17153A;border-radius:36px;padding:20px 24px;display:flex;flex-direction:column;gap:6px\">\n                      <span style=\"font-size:13px;font-weight:800\">Lumi piensa… · {{ cicloLabel }}<\u002Fspan>\n                      <p style=\"margin:0;font-size:16px;line-height:1.55\">{{ t.accion }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span style=\"position:absolute;left:4px;bottom:26px;width:24px;height:24px;border-radius:999px;background:#C6F24E;border:3px solid #17153A\"><\u002Fspan>\n                    <span style=\"position:absolute;left:-14px;bottom:6px;width:14px;height:14px;border-radius:999px;background:#C6F24E;border:3px solid #17153A\"><\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#FFFFFF;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:18px\">\n                <span style=\"font-size:13px;font-weight:600;color:#4B3BFF\">{{ t.kind }} · {{ t.rol }} · {{ t.city }}<\u002Fspan>\n                <strong style=\"font-family:'Bricolage Grotesque';font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em\">{{ t.headline }}<\u002Fstrong>\n                <sc-if value=\"{{ t.isDots }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:14px\">\n                    <span style=\"font-size:13px;color:#55527A\">De cada 10 ofertas, cuántas lo piden<\u002Fspan>\n                    <sc-for list=\"{{ t.dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n                      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:12px;align-items:center;font-size:14px\">\n                        <span style=\"font-weight:{{ d.weight }}\">{{ d.name }}<\u002Fspan>\n                        <div style=\"display:flex;gap:4px\"><sc-for list=\"{{ d.cells }}\" as=\"c\" hint-placeholder-count=\"10\"><span style=\"width:14px;height:14px;border-radius:4px;background:{{ c.bg }}\"><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\"><strong style=\"font-size:14px\">{{ d.value }}<\u002Fstrong><span style=\"font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:{{ d.dBg }}\">{{ d.delta }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ t.isLine }}\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px\">\n                    <span style=\"font-size:13px;color:#55527A\">% de ofertas que lo piden, por trimestre<\u002Fspan>\n                    <div style=\"width:100%\">{{ t.lineChart }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:8px 16px;flex-wrap:wrap\"><sc-for list=\"{{ t.legend }}\" as=\"l\" hint-placeholder-count=\"4\"><span style=\"display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;flex-shrink:0;font-weight:{{ l.weight }}\"><span style=\"width:14px;height:4px;border-radius:2px;background:{{ l.color }}\"><\u002Fspan>{{ l.name }} <span style=\"color:#55527A;font-weight:400\">{{ l.delta }}<\u002Fspan><\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ t.isSal }}\">\n                  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n                    <div style=\"background:#F3F2FF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12px;color:#55527A\">Entrada (P25)<\u002Fspan><strong style=\"font-family:'Bricolage Grotesque';font-size:24px\">{{ t.p25 }}<\u002Fstrong><\u002Fdiv>\n                    <div style=\"background:#C6F24E;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12px;font-weight:600\">Mediana<\u002Fspan><strong style=\"font-family:'Bricolage Grotesque';font-size:24px\">{{ t.med }}<\u002Fstrong><\u002Fdiv>\n                    <div style=\"background:#F3F2FF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:12px;color:#55527A\">Parte alta (P75)<\u002Fspan><strong style=\"font-family:'Bricolage Grotesque';font-size:24px\">{{ t.p75 }}<\u002Fstrong><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:8px;padding:6px 0 2px\">\n                    <div style=\"position:relative;height:36px\">\n                      <div style=\"position:absolute;left:0;right:0;top:15px;height:6px;border-radius:999px;background:#EEEDF8\"><\u002Fdiv>\n                      <div style=\"position:absolute;top:8px;height:20px;border-radius:999px;background:#C9C4FF;left:{{ t.bandL }}%;width:{{ t.bandW }}%\"><\u002Fdiv>\n                      <div style=\"position:absolute;top:0;height:36px;width:6px;margin-left:-3px;border-radius:3px;background:#17153A;left:{{ t.medL }}%\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"position:relative;height:16px;font-size:12px;color:#55527A\"><span style=\"position:absolute;left:0\">{{ t.minL }}<\u002Fspan><span style=\"position:absolute;right:0\">{{ t.maxL }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:13px;color:#55527A\">Franja = la mitad central de las ofertas · línea = mediana · sueldo bruto mensual<\u002Fspan>\n                <\u002Fsc-if>\n                <div style=\"background:#F3F2FF;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"display:flex;justify-content:space-between\"><strong style=\"font-size:14px\">De dónde sale este dato<\u002Fstrong><a sc-camel-on-click=\"{{ t.fuente }}\" style=\"font-size:13px\">Ver muestra ↗<\u002Fa><\u002Fdiv>\n                  <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:13px\"><span style=\"color:#55527A\">Muestra<\u002Fspan><span>{{ t.muestra }}<\u002Fspan><span style=\"color:#55527A\">Periodo<\u002Fspan><span>jul – oct 2026<\u002Fspan><span style=\"color:#55527A\">Portales<\u002Fspan><span>Computrabajo, Bumeran, LinkedIn<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n<\u002Fdiv><\u002Fsc-for>\n            <sc-if value=\"{{ pendingShow }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <div style=\"align-self:flex-end;background:#4B3BFF;color:#FFFFFF;border-radius:22px 22px 6px 22px;padding:14px 20px;font-size:16px;max-width:620px;line-height:1.45\">{{ pendingQ }}<\u002Fdiv>\n                <div style=\"align-self:flex-start;background:#FFFFFF;border-radius:20px;padding:16px 22px;display:flex;align-items:center;gap:14px;width:100%;max-width:440px\">\n                  <img src=\"d93c51b8-e7d8-49fd-9e6b-b931e8e547ee\" alt=\"Lumi\" style=\"width:56px;height:62px;flex-shrink:0\">\n                  <div style=\"display:flex;flex-direction:colum an'],['Practicante de Analítica Web','Banca · Surco · LinkedIn']]),\n    R('Community Manager', [['Gestión de redes',91,2],['Creación de contenido',84,4],['Meta Ads',52,13],['Excel',48,5]], [1800,2300,3000], 640, 352, 'Meta Ads y Excel básico para reportar métricas', [['Community Manager Jr.','Agencia · Barranco · Bumeran'],['Social Media Assistant','Consumo masivo · Surquillo · LinkedIn'],['Practicante de Redes Sociales','Educación · Lima · Computrabajo']]),\n  ],\n  'Administración': [R('Asistente de Proyectos', [['Excel avanzado',79,3],['MS Project',46,5],['Power BI',41,9],['Scrum',33,7]], [2200,2800,3600], 734, 402, 'Power BI y una certificación ágil')],\n  'Ing. de Sistemas': [R('Desarrollador Junior', [['JavaScript',74,2],['SQL',68,1],['React',52,8],['AWS',31,10]], [3000,3900,5200], 1210, 655, 'un proyecto en React desplegado en AWS')],\n  'Ing. Industrial': [R('Analista de Mejora Continua', [['Excel avanzado',81,1],['Lean',63,4],['Power BI',49,9],['SAP',37,3]], [2600,3300,4300], 512, 287, 'Power BI y una certificación Lean')],\n  'Contabilidad': [R('Asistente Contable', [['Excel avanzado',88,1],['Concar',54,-3],['SAP',41,6],['NIIF',39,4]], [1700,2200,2900], 1045, 610, 'SAP básico y un curso de NIIF')],\n  'Psicología': [R('Analista de Selección', [['Entrevista por competencias',77,1],['Excel',52,6],['LinkedIn Recruiter',44,9],['Power BI',21,5]], [1900,2500,3300], 486, 271, 'Excel intermedio y LinkedIn Recruiter')],\n  'Derecho': [R('Asistente Legal', [['Redacción de contratos',72,2],['Inglés avanzado',48,5],['Excel',37,4],['Legaltech',18,7]], [1600,2300,3200], 398, 204, 'inglés avanzado y Excel básico')],\n  'Diseño': [R('Diseñador UX/UI Jr.', [['Figma',86,5],['Prototipado',71,3],['Adobe CC',58,-4],['UX Research',44,8]], [2500,3200,4200], 433, 238, 'UX Research y un portafolio en Figma')],\n  'Comunicaciones': [R('Content Manager', [['Redacción SEO',69,6],['Edición de video',57,12],['Meta Business',49,7],['Google Analytics',38,4]], [2000,2700,3500], 377, 199, 'edición de video corto y Analytics')],\n  'Economía': [R('Analista de Riesgos', [['Excel avanzado',84,0],['SQL',61,7],['Python',47,11],['Power BI',43,5]], [3200,4100,5300], 455, 260, 'Python y SQL')],\n};\nconst CARRERAS = Object.keys(DATA);\nconst CIUDADES = [['Lima',1,1],['Arequipa',.86,.14],['Trujillo',.82,.07]];\nconst TEMAS = ['Habilidades','Salarios','Tendencia'];\nconst CICLOS = ['1ro – 2do','3ro – 4to','5to – 6to','7mo o más'];\nconst LQ = {'Marketing':[['¿Qué herramientas piden para Community Manager en Lima?','Habilidades'],['¿Cuánto gana un Analista de Marketing Digital junior?','Salarios'],['¿Excel o Power BI: cuál pesa más en marketing?','Comparar']],'Administración':[['¿Qué piden para Asistente de Proyectos?','Habilidades'],['¿Qué certificaciones suben el sueldo de un administrador?','Salarios'],['¿Qué rubros contratan más practicantes?','Mercado']],'Ing. de Sistemas':[['¿Qué lenguajes piden para desarrollador junior en Arequipa?','Habilidades'],['¿Cuánto paga un analista QA con 1 año?','Salarios'],['¿Crece la demanda de Cloud en Perú?','Tendencia']],'Ing. Industrial':[['¿Qué piden para analista de mejora continua?','Habilidades'],['¿Lean Six Sigma realmente aparece en las ofertas?','Tendencia'],['¿Cuánto gana un supervisor de producción junior?','Salarios']],'Contabilidad':[['¿Qué ERP piden más: SAP o Concar?','Comparar'],['¿Cuánto gana un asistente contable en Lima?','Salarios'],['¿Piden NIIF en ofertas junior?','Habilidades']],'Psicología':[['¿Qué piden para analista de selección?','Habilidades'],['¿Cuánto paga RR.HH. frente a psicología clínica?','Salarios'],['¿Qué herramientas digitales piden en psicología organizacional?','Habilidades']],'Derecho':[['¿Qué áreas del derecho contratan más practicantes?','Mercado'],['¿Piden inglés para asistente legal corporativo?','Habilidades'],['¿Cuánto gana un abogado junior en Lima?','Salarios']],'Diseño':[['¿Figma o Adobe: qué piden más para UX/UI?','Comparar'],['¿Cuánto paga un diseñador gráfico junior?','Salarios'],['¿Las agencias piden motion graphics?','Habilidades']],'Comunicaciones':[['¿Qué piden para ejecutivo de comunicación interna?','Habilidades'],['¿Se pide edición de video en periodismo digital?','Tendencia'],['¿Cuánto gana un content manager?','Salarios']],'Economía':[['¿Qué piden para analista de riesgos en banca?','Habilidades'],['¿Python o Stata: qué piden más?','Comparar'],['¿Cuánto gana un analista económico junior?','Salarios']]};\nconst PACKS = [{k:'10 consultas',d:'S/ 1.20 por consulta · válidas 12 meses',precio:'S/ 12',add:10},{k:'25 consultas',d:'S/ 1.00 por consulta · válidas 12 meses',precio:'S/ 25',add:25},{k:'Pro',d:'Ilimitadas · todas las regiones',precio:'S/ 29/mes',add:0,pro:true}];\nconst METODOS = [{k:'Tarjeta',d:'Visa, Mastercard, Amex, Diners'},{k:'Yape',d:'Con código de aprobación'},{k:'Plin',d:'Escanea un QR desde tu banco'},{k:'PagoEfectivo',d:'Agentes, bodegas o banca móvil'}];\nconst S = (v) => 'S/ ' + (Math.round(v / 50) * 50).toLocaleString('en-US');\nconst pill = (on) => ({ bg: on ? '#4B3BFF' : '#F3F2FF', fg: on ? '#FFFFFF' : '#17153A' });\nconst INIT = { screen:'landing', name:'', email:'', emailTouched:false, pw:'', lpw:'', regStep:0, uni:'', ciudadReg:0, intereses:[], objetivo:null, fuenteReg:null, refCode:'', terms:false, tried:false, perfil:'Estudiante', carrera:null, ciclo:2, credits:3, max:3, plan:'free', b:{carrera:'Marketing', rol:0, ciudad:0, tema:0}, q:'', chats:[], cur:-1, pending:null, modalMuestra:'', lc:'Marketing', load:0, modal:false, pack:0, met:1, paying:false, wall:false, toast:'' };\n\nclass Component extends DCLogic {\n  state = { ...INIT, b: { ...INIT.b } };\n  timers = [];\n  componentWillUnmount() { this.timers.forEach(clearTimeout); }\n  goSec(id) { const el = document.getElementById(id); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); }\n  regVals(st, emailOk) {\n    const step = st.regStep, CIU = ['Lima', 'Arequipa', 'Trujillo', 'Otra'];\n    const ok = [st.name.trim() && emailOk && st.pw.length >= 8, st.uni.trim() && st.carrera, st.intereses.length > 0 && st.objetivo, st.fuenteReg && st.terms][step];\n    const hints = ['Completa nombre, correo y una contraseña de 8 caracteres.', 'Indica tu universidad y carrera.', 'Elige al menos un área y tu objetivo.', 'Elige una opción y acepta los términos.'];\n    const msgs = ['¡Hola! Soy Lumi. En 4 pasos armamos tu perfil para darte datos a tu medida.', 'Con tu carrera y ciclo te digo qué priorizar antes de tus prácticas.', 'Así te aviso cuando algo de tu interés empiece a crecer en el mercado.', '¡Último paso! Gracias por contarnos cómo llegaste.'];\n    const mark = (on) => ({ bg: on ? '#4B3BFF' : '#F3F2FF', fg: on ? '#FFFFFF' : '#17153A' });\n    const toggle = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v];\n    return {\n      rs0: step === 0, rs1: step === 1, rs2: step === 2, rs3: step === 3,\n      regNum: step + 1, regPct: (step + 1) * 25,\n      regSteps: ['Cuenta', 'Tus estudios', 'Intereses', '¿Cómo nos conociste?'].map((label, i) => ({ label, mark: i < step ? '✓' : String(i + 1), dotBg: i < step ? '#C6F24E' : i === step ? '#FFFFFF' : 'rgba(255,255,255,.18)', dotFg: i <= step ? '#17153A' : '#FFFFFF', fg: i <= step ? '#FFFFFF' : '#C9C4FF' })),\n      lumiMsg: msgs[step],\n      pwBad: st.tried && step === 0 && st.pw.length < 8,\n      ciudadesReg: CIU.map((c, i) => ({ label: c, ...mark(st.ciudadReg === i), pick: () => this.setState({ ciudadReg: i }) })),\n      intereses: ['Marketing digital', 'Finanzas', 'Datos y analítica', 'Programación', 'Recursos humanos', 'Diseño', 'Emprendimiento', 'Logística', 'Derecho corporativo', 'Sostenibilidad'].map(v => ({ label: v, ...mark(st.intereses.includes(v)), pick: () => this.setState(s => ({ intereses: toggle(s.intereses, v) })) })),\n      objetivos: ['Conseguir prácticas', 'Mi primer empleo', 'Elegir especialidad', 'Cambiar de rubro', 'Subir mi sueldo'].map(v => ({ label: v, ...mark(st.objetivo === v), pick: () => this.setState({ objetivo: v }) })),\n      fuentes: ['TikTok', 'Instagram', 'LinkedIn', 'Un amigo o compañero', 'Mi universidad', 'Un docente', 'Google', 'Feria laboral', 'Otro'].map(v => ({ label: v, ...mark(st.fuenteReg === v), pick: () => this.setState({ fuenteReg: v }) })),\n      termsBg: st.terms ? '#4B3BFF' : '#FFFFFF', termsMark: st.terms ? '✓' : '',\n      toggleTerms: () => this.setState(s => ({ terms: !s.terms })),\n      backLabel: step === 0 ? 'Ya tengo cuenta' : '← Atrás',\n      regBack: () => step === 0 ? this.setState({ screen: 'login' }) : this.setState({ regStep: step - 1, tried: false }),\n      nextLabel: step === 3 ? 'Crear cuenta y empezar' : 'Continuar',\n      nextBg: ok ? '#4B3BFF' : '#C9C4FF',\n      regHint: ok ? (step === 3 ? 'Tendrás 3 consultas gratis cada mes.' : ' ') : hints[step],\n      regNext: () => {\n        if (!ok) return this.setState({ tried: true, emailTouched: true });\n        if (step < 3) return this.setState({ regStep: step + 1, tried: false });\n        this.setState({ screen: 'consulta', b: { ...st.b, carrera: st.carrera, rol: 0, ciudad: st.ciudadReg === 3 ? 0 : st.ciudadReg } });\n      },\n    };\n  }\n  lineChart(series) {\n    const e = React.createElement, W = 520, Hh = 210, X0 = 44, X1 = 480, Y0 = 20, Y1 = 170;\n    const all = series.flatMap(s => s.pts), mn = Math.max(0, Math.floor(Math.min(...all) / 10) * 10), mx = Math.min(100, Math.ceil(Math.max(...all) / 10) * 10 + 5);\n    const x = (i) => X0 + (X1 - X0) * i / 3, y = (v) => Y1 - (v - mn) / (mx - mn) * (Y1 - Y0);\n    const ticks = [mn, Math.round((mn + mx) / 2), mx];\n    const kids = [];\n    ticks.forEach((tv, i) => { kids.push(e('line', { key: 'g' + i, x1: X0, x2: X1, y1: y(tv), y2: y(tv), stroke: '#EEEDF8', strokeWidth: 1.5 })); kids.push(e('text', { key: 'gt' + i, x: X0 - 10, y: y(tv) + 4, textAnchor: 'end', fontSize: 12, fill: '#55527A', fontFamily: 'Onest' }, tv + '%')); });\n    ['2025 T4', '2026 T1', '2026 T2', '2026 T3'].forEach((l, i) => kids.push(e('text', { key: 'x' + i, x: x(i), y: Hh - 12, textAnchor: 'middle', fontSize: 12, fill: '#55527A', fontFamily: 'Onest' }, l)));\n    [...series].reverse().forEach((s, si) => {\n      const d = s.pts.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');\n      const c = s.top ? '#4B3BFF' : '#C9C4FF';\n      kids.push(e('path', { key: 'p' + si, d, fill: 'none', stroke: c, strokeWidth: s.top ? 4 : 2.5, strokeLinecap: 'round', strokeLinejoin: 'round' }));\n      kids.push(e('circle', { key: 'c' + si, cx: x(3), cy: y(s.pts[3]), r: s.top ? 6 : 4, fill: c, stroke: '#FFFFFF', strokeWidth: 2 }));\n    });\n    return e('svg', { viewBox: '0 0 ' + W + ' ' + Hh, style: { width: '100%', height: 'auto', display: 'block' } }, kids);\n  }\n  later(fn, ms) { this.timers.push(setTimeout(fn, ms)); }\n\n  question(b) {\n    const rol = DATA[b.carrera][b.rol].n, c = CIUDADES[b.ciudad][0];\n    return [`¿Qué piden para ${rol} en ${c}?`, `¿Cuánto gana un ${rol} junior en ${c}?`, `¿Qué está creciendo para ${rol} en ${c}?`][b.tema];\n  }\n  parse(text) {\n    const t = text.toLowerCase(), b = { ...this.state.b };\n    b.tema = /gana|sueldo|paga|salari|cu[aá]nto/.test(t) ? 1 : /crece|creciendo|tendencia|sube/.test(t) ? 2 : 0;\n    CIUDADES.forEach(([n], i) => { if (t.includes(n.toLowerCase())) b.ciudad = i; });\n    for (const c of CARRERAS) DATA[c].forEach((r, i) => {\n      const key = r.n.toLowerCase().replace(/ jr\\.| junior/g, '').split(' ').slice(0, 2).join(' ');\n      if (t.includes(key) || (r.n === 'Community Manager' && /community|\\bcm\\b/.test(t))) { b.carrera = c; b.rol = i; }\n    });\n    return b;\n  }\n  compute(b, q) {\n    const role = DATA[b.carrera][b.rol], [city, sf, nf] = CIUDADES[b.ciudad];\n    const n = Math.round(role.cnt * nf), ns = Math.round(role.ns * nf);\n    const base = { q, rol: role.n, city, n, b, kind: TEMAS[b.tema] };\n    if (n < 30) return { ...base, insuf: true, ok: false };\n    const sk
